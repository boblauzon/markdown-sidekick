# Publish markdown-sidekick to PyPI.
#
# Runs automatically when a GitHub Release is published, and can be started by
# hand from the Actions tab (pick the tag to build from). Uses PyPI "trusted
# publishing" (OIDC) — there is no API token to create, store, or rotate.
#
# One-time setup (see README → "Releasing"):
#   1. On PyPI: Account settings → Publishing → add a pending publisher for
#      project "markdown-sidekick", owner "boblauzon", repo "markdown-sidekick",
#      workflow "publish.yml", environment "pypi".
#   2. On GitHub: repo Settings → Environments → create "pypi".
#
# The build job needs no project dependencies (it only builds the sdist/wheel),
# so it runs on Linux even though the app itself targets Windows.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir pkg .
          python -m twine check pkg/*

      - name: Check the tag matches pyproject.toml
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$ver" ]; then
            echo "Release tag v$tag does not match pyproject version $ver" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: pkg/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/markdown-sidekick/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: pkg/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/
