# Run the test suite on every pull request and push to main.
#
# Windows only: the app is Windows-first (DirectML OCR, Win32 error codes in
# the save path, the frozen exe). The Whisper end-to-end tests skip themselves
# when the model isn't cached, so CI never downloads it.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          # Dev-only: deliberately not in requirements.txt.
          python -m pip install pytest pyyaml

      - name: Run tests
        run: python -m pytest tests/ -q -p no:cacheprovider
